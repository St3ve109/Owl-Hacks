<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OWL HACKS - MLB Live Scores</title>
    <style>
        body {
            background-color: #0a0a0a;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
        }
        
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .header h1 {
            font-size: 4em;
            margin: 20px 0;
            background: linear-gradient(45deg, #ff6b35, #f7931e);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .mlb-section {
            max-width: 1200px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            padding: 20px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .mlb-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        
        .mlb-title {
            font-size: 2em;
            color: #ff6b35;
            margin: 0;
        }
        
        .refresh-btn {
            background: linear-gradient(45deg, #ff6b35, #f7931e);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 1em;
            transition: transform 0.2s;
        }
        
        .refresh-btn:hover {
            transform: scale(1.05);
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            font-size: 1.2em;
        }
        
        .error {
            background: rgba(255, 0, 0, 0.1);
            border: 1px solid #ff0000;
            color: #ff6b6b;
            padding: 15px;
            border-radius: 10px;
            margin: 20px 0;
        }
        
        .games-container {
            display: grid;
            gap: 20px;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
        }
        
        .game-card {
            background: rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            padding: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        .game-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(255, 107, 53, 0.2);
        }
        
        .game-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        
        .game-status {
            background: rgba(255, 107, 53, 0.2);
            color: #ff6b35;
            padding: 5px 12px;
            border-radius: 15px;
            font-size: 0.9em;
            font-weight: bold;
        }
        
        .teams {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 15px 0;
        }
        
        .team {
            text-align: center;
            flex: 1;
        }
        
        .team-name {
            font-size: 1.1em;
            font-weight: bold;
            margin-bottom: 5px;
        }
        
        .team-abbr {
            color: #888;
            font-size: 0.9em;
        }
        
        .team-score {
            font-size: 2em;
            font-weight: bold;
            color: #ff6b35;
            margin: 10px 0;
        }
        
        .vs {
            font-size: 1.5em;
            color: #666;
            margin: 0 20px;
        }
        
        .game-info {
            display: flex;
            justify-content: space-between;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            font-size: 0.9em;
            color: #ccc;
        }
        
        .venue, .weather {
            flex: 1;
        }
        
        .records {
            display: flex;
            justify-content: space-between;
            margin: 10px 0;
            font-size: 0.9em;
            color: #aaa;
        }
        
        .no-games {
            text-align: center;
            padding: 40px;
            color: #888;
            font-size: 1.2em;
        }
        
        .last-updated {
            text-align: center;
            margin-top: 20px;
            color: #666;
            font-size: 0.9em;
        }
        
        
        @media (max-width: 768px) {
            .header h1 {
                font-size: 2.5em;
            }
            
            .games-container {
                grid-template-columns: 1fr;
            }
            
            .mlb-header {
                flex-direction: column;
                gap: 15px;
            }
            
            .teams {
                flex-direction: column;
                gap: 10px;
            }
            
            .vs {
                margin: 10px 0;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>OWL HACKS</h1>
        <div class="mlb-section">
            <div class="mlb-header">
                <h2 class="mlb-title">⚾ MLB Live Scores</h2>
                <button class="refresh-btn" onclick="refreshScores()">🔄 Refresh</button>
            </div>
            
            <div id="loading" class="loading">
                Loading MLB scores...
            </div>
            
            <div id="error" class="error" style="display: none;"></div>
            
            <div id="games-container" class="games-container" style="display: none;"></div>
            
            <div id="no-games" class="no-games" style="display: none;">
                No games scheduled for today.
            </div>
            
            <div id="last-updated" class="last-updated"></div>
        </div>
        
    </div>

    <script>
        let lastUpdateTime = null;
        
        // Use a more reliable approach with JSONP or direct API
        async function fetchMLBScores() {
            try {
                // Try direct fetch first (some browsers allow it)
                const response = await fetch('https://site.api.espn.com/apis/site/v2/sports/baseball/mlb/scoreboard', {
                    method: 'GET',
                    mode: 'cors',
                    headers: {
                        'Accept': 'application/json',
                    }
                });
                
                if (response.ok) {
                    const data = await response.json();
                    const formattedData = formatMLBData(data);
                    displayScores(formattedData);
                    lastUpdateTime = new Date();
                    updateLastUpdated();
                    return;
                }
            } catch (error) {
                console.log('Direct fetch failed, trying alternative...');
            }
            
            // If direct fetch fails, show sample data
            showSampleData();
        }
        
        function showSampleData() {
            const sampleData = {
                date: new Date().toISOString().split('T')[0],
                total_games: 3,
                games: [
                    {
                        game_id: 'sample1',
                        date: new Date().toISOString(),
                        status: 'Live',
                        home_team: {
                            name: 'New York Yankees',
                            abbreviation: 'NYY',
                            score: '4',
                            record: '85-67'
                        },
                        away_team: {
                            name: 'Boston Red Sox',
                            abbreviation: 'BOS',
                            score: '2',
                            record: '78-74'
                        },
                        venue: 'Yankee Stadium',
                        weather: '72°F, Clear'
                    },
                    {
                        game_id: 'sample2',
                        date: new Date().toISOString(),
                        status: 'Final',
                        home_team: {
                            name: 'Los Angeles Dodgers',
                            abbreviation: 'LAD',
                            score: '6',
                            record: '92-60'
                        },
                        away_team: {
                            name: 'San Francisco Giants',
                            abbreviation: 'SF',
                            score: '3',
                            record: '79-73'
                        },
                        venue: 'Dodger Stadium',
                        weather: '75°F, Sunny'
                    },
                    {
                        game_id: 'sample3',
                        date: new Date().toISOString(),
                        status: 'Scheduled',
                        home_team: {
                            name: 'Houston Astros',
                            abbreviation: 'HOU',
                            score: '0',
                            record: '88-64'
                        },
                        away_team: {
                            name: 'Atlanta Braves',
                            abbreviation: 'ATL',
                            score: '0',
                            record: '90-62'
                        },
                        venue: 'Minute Maid Park',
                        weather: '78°F, Partly Cloudy'
                    }
                ]
            };
            
            displayScores(sampleData);
            lastUpdateTime = new Date();
            updateLastUpdated();
            
            // Show a notice that this is sample data
            const errorDiv = document.getElementById('error');
            errorDiv.innerHTML = '⚠️ Showing sample data - API connection unavailable. Click refresh to try again.';
            errorDiv.style.display = 'block';
            errorDiv.style.background = 'rgba(255, 165, 0, 0.1)';
            errorDiv.style.border = '1px solid #ffa500';
            errorDiv.style.color = '#ffa500';
        }
        
        function formatMLBData(data) {
            const events = data.events || [];
            const formattedGames = events.map(event => {
                const competition = event.competitions?.[0] || {};
                const competitors = competition.competitors || [];
                
                if (competitors.length < 2) return null;
                
                const homeTeam = competitors.find(c => c.homeAway === 'home') || competitors[0];
                const awayTeam = competitors.find(c => c.homeAway === 'away') || competitors[1];
                
                return {
                    game_id: event.id,
                    date: event.date,
                    status: competition.status?.type?.name || 'Unknown',
                    home_team: {
                        name: homeTeam.team?.displayName || 'Unknown',
                        abbreviation: homeTeam.team?.abbreviation || 'UNK',
                        score: homeTeam.score || '0',
                        record: homeTeam.records?.[0]?.summary || '0-0'
                    },
                    away_team: {
                        name: awayTeam.team?.displayName || 'Unknown',
                        abbreviation: awayTeam.team?.abbreviation || 'UNK',
                        score: awayTeam.score || '0',
                        record: awayTeam.records?.[0]?.summary || '0-0'
                    },
                    venue: competition.venue?.fullName || 'Unknown Venue',
                    weather: competition.weather?.displayValue || 'N/A'
                };
            }).filter(game => game !== null);
            
            return {
                date: new Date().toISOString().split('T')[0],
                total_games: formattedGames.length,
                games: formattedGames
            };
        }
        
        async function refreshScores() {
            document.getElementById('loading').style.display = 'block';
            document.getElementById('error').style.display = 'none';
            document.getElementById('games-container').style.display = 'none';
            document.getElementById('no-games').style.display = 'none';
            
            try {
                await fetchMLBScores();
            } finally {
                document.getElementById('loading').style.display = 'none';
            }
        }
        
        function displayScores(data) {
            const container = document.getElementById('games-container');
            const noGames = document.getElementById('no-games');
            
            if (!data.games || data.games.length === 0) {
                container.style.display = 'none';
                noGames.style.display = 'block';
                return;
            }
            
            container.innerHTML = '';
            data.games.forEach(game => {
                const gameCard = createGameCard(game);
                container.appendChild(gameCard);
            });
            
            container.style.display = 'grid';
            noGames.style.display = 'none';
        }
        
        function createGameCard(game) {
            const card = document.createElement('div');
            card.className = 'game-card';
            
            const statusClass = getStatusClass(game.status);
            
            card.innerHTML = `
                <div class="game-header">
                    <div class="game-status ${statusClass}">${game.status}</div>
                </div>
                
                <div class="teams">
                    <div class="team">
                        <div class="team-name">${game.away_team.name}</div>
                        <div class="team-abbr">${game.away_team.abbreviation}</div>
                        <div class="team-score">${game.away_team.score}</div>
                    </div>
                    
                    <div class="vs">VS</div>
                    
                    <div class="team">
                        <div class="team-name">${game.home_team.name}</div>
                        <div class="team-abbr">${game.home_team.abbreviation}</div>
                        <div class="team-score">${game.home_team.score}</div>
                    </div>
                </div>
                
                <div class="records">
                    <span>${game.away_team.abbreviation}: ${game.away_team.record}</span>
                    <span>${game.home_team.abbreviation}: ${game.home_team.record}</span>
                </div>
                
                <div class="game-info">
                    <div class="venue">📍 ${game.venue}</div>
                    <div class="weather">🌤️ ${game.weather}</div>
                </div>
            `;
            
            return card;
        }
        
        function getStatusClass(status) {
            const statusLower = status.toLowerCase();
            if (statusLower.includes('live') || statusLower.includes('in progress')) {
                return 'status-live';
            } else if (statusLower.includes('final')) {
                return 'status-final';
            } else if (statusLower.includes('scheduled')) {
                return 'status-scheduled';
            }
            return 'status-default';
        }
        
        function showError(message) {
            const errorDiv = document.getElementById('error');
            errorDiv.textContent = message;
            errorDiv.style.display = 'block';
        }
        
        function updateLastUpdated() {
            if (lastUpdateTime) {
                const timeString = lastUpdateTime.toLocaleTimeString();
                document.getElementById('last-updated').textContent = `Last updated: ${timeString}`;
            }
        }
        
        // Load scores on page load
        document.addEventListener('DOMContentLoaded', function() {
            fetchMLBScores();
            
            // Auto-refresh every 60 seconds (less frequent to avoid proxy issues)
            setInterval(fetchMLBScores, 60000);
        });
    </script>
</body>
</html>
